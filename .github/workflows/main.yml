name: Mocha 10x 200MB Multipart Test Upload

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    env:
      MOCHA_API_KEY: ${{ secrets.MOCHA_API_KEY }}
      FOLDER_PATH: 'downloaded_files'

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: python3 -m pip install --no-cache-dir --break-system-packages natsort requests

      - name: Create 10x 200MB Test Files
        run: |
          mkdir -p "$FOLDER_PATH"
          for i in {1..10}; do
            dd if=/dev/urandom of="$FOLDER_PATH/test_upload_file_$i.mp4" bs=1M count=200 status=none
            echo "Generated file $i"
          done

      - name: Upload to Mocha via Multipart API
        run: |
          python3 -u - << 'EOF'
          import os, sys, hashlib, time, requests
          from concurrent.futures import ThreadPoolExecutor
          from natsort import natsorted

          API_KEY = os.environ.get('MOCHA_API_KEY', 'mocha_P_unI7MM0hsvBpSoAq5rO1YUffrsBsPUB3g6pRNUdAY').strip()
          FOLDER_PATH = os.environ.get('FOLDER_PATH', 'downloaded_files')
          BASE_URL = "https://api.mocha.my/api"
          DIRECT_PART_SIZE = 1073741824  # 1GB

          if not API_KEY:
              print("❌ MOCHA_API_KEY is missing (add it as a repo secret)", flush=True)
              sys.exit(1)

          HEADERS = {"Authorization": f"Bearer {API_KEY}", "Content-Type": "application/json"}

          def md5_of(path):
              h = hashlib.md5()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          class PartReader:
              """File-like wrapper that streams only [offset, offset+length) of a file."""
              def __init__(self, path, offset, length):
                  self.f = open(path, "rb")
                  self.f.seek(offset)
                  self.remaining = length
                  self.length = length
              def __len__(self):
                  return self.length
              def read(self, n=-1):
                  if self.remaining <= 0:
                      return b""
                  n = self.remaining if n is None or n < 0 else min(n, self.remaining)
                  data = self.f.read(n)
                  self.remaining -= len(data)
                  return data
              def close(self):
                  self.f.close()

          def put_part(url, path, offset, length, retries=3):
              last = None
              for attempt in range(1, retries + 1):
                  reader = PartReader(path, offset, length)
                  try:
                      # No auth/JSON headers: presigned URLs reject them
                      r = requests.put(url, data=reader, headers={"Content-Length": str(length)}, timeout=900)
                      if r.status_code in (200, 201, 204):
                          etag = r.headers.get("ETag") or r.headers.get("etag")
                          if etag:
                              return etag
                          last = "no ETag header in response"
                      else:
                          last = f"HTTP {r.status_code}: {r.text[:300]}"
                  except Exception as e:
                      last = str(e)
                  finally:
                      reader.close()
                  time.sleep(2 * attempt)
              raise RuntimeError(f"part upload failed: {last}")

          def upload(path):
              name = os.path.basename(path)
              size = os.path.getsize(path)
              print(f"⬆ START {name} ({size / 1048576:.1f} MB)", flush=True)
              try:
                  # 1. init
                  r = requests.post(f"{BASE_URL}/files/multipart/init", headers=HEADERS, timeout=60, json={
                      "originalName": name, "size": size, "mimeType": "video/mp4",
                      "path": "/test/", "directPartSizeBytes": DIRECT_PART_SIZE,
                  })
                  if r.status_code not in (200, 201):
                      raise RuntimeError(f"init failed [{r.status_code}]: {r.text[:500]}")
                  data = r.json()
                  res = data.get("result", data)
                  print(f"ℹ init keys for {name}: {list(res.keys())}", flush=True)

                  upload_id = res.get("uploadId")
                  parts = res.get("parts") or []
                  if not parts:
                      u = res.get("url") or res.get("uploadUrl") or res.get("signedUrl")
                      if u:
                          parts = [{"partNumber": 1, "url": u}]
                  if not upload_id or not parts:
                      raise RuntimeError(f"unexpected init response: {data}")

                  parts = sorted(parts, key=lambda p: p.get("partNumber", 1))

                  # 2. work out part size (server-provided, else even split)
                  part_size = res.get("partSize") or res.get("partSizeBytes")
                  if not part_size:
                      part_size = -(-size // len(parts))  # ceil division

                  done = []
                  for p in parts:
                      num = p.get("partNumber", 1)
                      url = p.get("url") or p.get("uploadUrl") or p.get("signedUrl")
                      if not url:
                          raise RuntimeError(f"part {num} has no URL: {p}")
                      offset = (num - 1) * part_size
                      length = min(part_size, size - offset)
                      if length <= 0:
                          continue
                      etag = put_part(url, path, offset, length)
                      etag = etag if etag.startswith('"') else f'"{etag}"'
                      done.append({"partNumber": num, "etag": etag})
                      print(f"  ✓ {name} part {num}/{len(parts)}", flush=True)

                  # 3. complete
                  r = requests.post(f"{BASE_URL}/files/multipart/complete", headers=HEADERS, timeout=120, json={
                      "uploadId": upload_id, "key": res.get("key"), "nodeId": res.get("nodeId"),
                      "originalName": name, "path": "/test/", "size": size,
                      "mimeType": "video/mp4", "md5": md5_of(path), "parts": done,
                  })
                  if r.status_code not in (200, 201):
                      raise RuntimeError(f"complete failed [{r.status_code}]: {r.text[:500]}")
                  print(f"✅ DONE {name}", flush=True)
                  return True
              except Exception as e:
                  print(f"❌ {name}: {e}", flush=True)
                  return False

          files = []
          for root, _, names in os.walk(FOLDER_PATH):
              for n in names:
                  if not any(x in n for x in (".!qB", ".part", ".aria2")):
                      files.append(os.path.join(root, n))
          files = natsorted(files)

          if not files:
              print("❌ No files found to upload", flush=True)
              sys.exit(1)

          print(f"🚀 Uploading {len(files)} files...", flush=True)
          with ThreadPoolExecutor(max_workers=2) as ex:
              results = list(ex.map(upload, files))

          failed = results.count(False)
          print(f"Finished: {len(results) - failed} ok, {failed} failed", flush=True)
          sys.exit(1 if failed else 0)
          EOF
