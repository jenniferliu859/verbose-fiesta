name: Mocha 10x 200MB Test Upload

on:
  push:
    branches: New
    
  workflow_dispatch:

jobs:
  test-upload:
    runs-on: ubuntu-latest
    env:
      MOCHA_API_KEY: 'mocha_P_unI7MM0hsvBpSoAq5rO1YUffrsBsPUB3g6pRNUdAY'
      FOLDER_PATH: 'downloaded_files'

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install jq python3 python3-requests python3-pip -y
          sudo python3 -m pip install --no-cache-dir --break-system-packages natsort requests

      - name: Create 10x 200MB Test Files
        run: |
          mkdir -p "$FOLDER_PATH"
          echo "Generating 10 separate 200MB test files for Mocha verification..."
          for i in {1..10}; do
            dd if=/dev/urandom of="$FOLDER_PATH/test_upload_file_$i.mp4" bs=1M count=200 status=none
            echo "Generated file $i: test_upload_file_$i.mp4 (200MB)"
          done

      - name: Upload to Mocha
        run: |
          python3 -u - << 'EOF'
          import os
          import sys
          import requests
          from concurrent.futures import ThreadPoolExecutor
          from natsort import natsorted

          API_KEY = os.environ.get('MOCHA_API_KEY', 'mocha_P_unI7MM0hsvBpSoAq5rO1YUffrsBsPUB3g6pRNUdAY').strip()
          FOLDER_PATH = os.environ.get('FOLDER_PATH', 'downloaded_files')
          # Standard Mocha upload/ingest endpoint structure
          UPLOAD_URL = "https://mocha.my/api/v1/upload"

          if not API_KEY:
              print("❌ ERROR: MOCHA_API_KEY environment variable is missing!", flush=True)
              sys.exit(1)

          HEADERS = {"Authorization": f"Bearer {API_KEY}"}

          def upload_single_file(file_path):
              filename = os.path.basename(file_path)
              file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
              print(f"⬆ [START] Uploading: {filename} ({file_size_mb:.2f} MB)", flush=True)

              try:
                  with open(file_path, "rb") as f:
                      files = {"file": (filename, f)}
                      response = requests.post(UPLOAD_URL, headers=HEADERS, files=files, timeout=3600)
                  
                  if response.status_code in [200, 201]:
                      print(f"✅ Successfully uploaded {filename}: {response.text}", flush=True)
                  else:
                      print(f"❌ Failed to upload {filename} [Status {response.status_code}]: {response.text}", flush=True)

              except Exception as e:
                  print(f"❌ Exception uploading {filename}: {str(e)}", flush=True)

          if os.path.exists(FOLDER_PATH):
              upload_queue = []
              for root, dirs, files in os.walk(FOLDER_PATH):
                  for filename in files:
                      if not any(ext in filename for ext in [".!qB", ".part", ".aria2"]):
                          upload_queue.append(os.path.join(root, filename))
              
              upload_queue = natsorted(upload_queue)
              
              if upload_queue:
                  print(f"🚀 Launching parallel upload workers for {len(upload_queue)} files...", flush=True)
                  with ThreadPoolExecutor(max_workers=3) as executor:
                      executor.map(upload_single_file, upload_queue)
          EOF
